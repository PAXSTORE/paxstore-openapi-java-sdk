name: Release to Maven Central
run-name: Release ${{ inputs.releaseVersion }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g. 10.2.1)'
        required: true
        type: string

permissions:
  contents: write   # commit / tag / release

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      RELEASE_VERSION: ${{ inputs.releaseVersion }}
      NEXT_SNAPSHOT: ''

    steps:
      # 1️⃣ 检出代码
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ 设置 JDK（Java 8，符合你现有项目）
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          server-id: maven-central-portal
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # 3️⃣ Git 身份
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4️⃣ 自动计算下一个 SNAPSHOT 版本
      - name: Compute next snapshot version
        id: versions
        run: |
          BASE=${{ env.RELEASE_VERSION }}
          MAJOR=$(echo $BASE | cut -d. -f1)
          MINOR=$(echo $BASE | cut -d. -f2)
          PATCH=$(echo $BASE | cut -d. -f3)

          NEXT_PATCH=$((PATCH + 1))
          NEXT="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"

          echo "nextSnapshot=$NEXT" >> $GITHUB_ENV
          echo "Next snapshot version: $NEXT"

      # 5️⃣ 移除 -SNAPSHOT
      - name: Set release version
        run: |
          mvn -B versions:set \
            -DnewVersion=${{ env.RELEASE_VERSION }} \
            -DgenerateBackupPoms=false

      - name: Commit release version
        run: |
          git add pom.xml
          git commit -m "chore: release ${{ env.RELEASE_VERSION }}"
          git push

      # 6️⃣ 打 tag
      - name: Create Git tag
        run: |
          git tag v${{ env.RELEASE_VERSION }}
          git push origin v${{ env.RELEASE_VERSION }}

      # 7️⃣ 运行测试（失败则终止，不发布）
      - name: Run tests
        run: mvn -B test -DskipTests=true

      # 8️⃣ 导入 GPG
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      # 9️⃣ 发布到 Maven Central
      - name: Publish to Maven Central
        run: mvn --batch-mode -Prelease deploy -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      # 🔟 Bump 下一 SNAPSHOT
      - name: Set next snapshot version
        run: |
          mvn -B versions:set \
            -DnewVersion=${{ env.NEXT_SNAPSHOT }} \
            -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: prepare next development iteration ${{ env.NEXT_SNAPSHOT }}"
          git push